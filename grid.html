<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three-column image grid | CE2000</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles/bootstrap-custom.css">
</head>
<body>
  <main class="container py-5">
    <a href="index.html" class="text-decoration-none">← Back to lab index</a>
    <p class="section-kicker mt-4">Week 3 · Activity 7</p>
    <h1 class="display-5 fw-bold">Three images in a responsive grid</h1>
    <p class="lead text-secondary">Each column uses Bootstrap's 12-column grid: three equal columns at medium screens and above, stacked on small screens.</p>
    <div class="row g-4 mt-2">
      <div class="col-12 col-md-4"><figure class="m-0"><img class="grid-image" src="assets/story-campus.svg" alt="Illustrated campus building"><figcaption class="mt-2 fw-semibold">Campus</figcaption></figure></div>
      <div class="col-12 col-md-4"><figure class="m-0"><img class="grid-image" src="assets/story-tech.svg" alt="Illustrated computer and code"><figcaption class="mt-2 fw-semibold">Technology</figcaption></figure></div>
      <div class="col-12 col-md-4"><figure class="m-0"><img class="grid-image" src="assets/story-learning.svg" alt="Illustrated study checklist"><figcaption class="mt-2 fw-semibold">Learning</figcaption></figure></div>
    </div>
  </main>
</body>
</html>
